[project]
name = "voice-stax"
version = "0.1.0"
description = "A modular voice assistant framework with support for TTS, STT, and LLM providers, enabling conversational AI."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sunitha L V", email = "sunithalv05@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "assemblyai==0.50.0",
    "elevenlabs==2.31.0",
    "fastapi==0.128.4",
    "groq==1.0.0",
    "jinja2==3.1.4",
    "langchain==1.2.12",
    "langchain-community==0.4.1",
    "langchain-core==1.2.19",
    "langchain-openai==1.1.11",
    "langchain-pinecone==0.2.13",
    "pdfplumber==0.11.4",
    "pinecone-client==6.0.0",
    "pyaudio==0.2.14",
    "pydantic>=2.0,<3.0",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "setuptools>=80.0.0",
    "soundfile==0.13.1",
    "tavily-python==0.7.23",
    "uvicorn>=0.23.2",
    "webrtcvad-wheels==2.0.14",
]
