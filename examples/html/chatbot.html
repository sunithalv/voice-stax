<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Stax</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0c14;--surface:#111522;--surface2:#161b2e;--border:#1e2540;
    --green:#00e5a0;--blue:#3d7fff;--muted:#4a5270;--text:#dde3f5;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;height:100vh}
  .container{width:100%;max-width:900px;height:90vh;display:flex;background:var(--surface);border-radius:16px;overflow:hidden}
  .sidebar{width:200px;background:var(--surface2);padding:20px;display:flex;flex-direction:column;gap:16px}
  .chat{flex:1;display:flex;flex-direction:column}
  .messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .message-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.message-row.user-row{
    justify-content:flex-end;
}

.message-row.ai-row{
    justify-content:flex-start;
}

.message-time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    text-align: right;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.user-avatar{
    background:#3d7fff33;
}

.ai-avatar{
    background:#00e5a033;
}

.msg{
    padding:10px 14px;
    border-radius:12px;
    max-width:70%;
}
.user{background:#3d7fff22;align-self:flex-end}
.ai{background:#00e5a022;align-self:flex-start}
.controls{padding:15px;border-top:1px solid var(--border);display:flex;gap:10px}
button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer}
.start{background:var(--green)}
.stop{background:#ff3d3d;color:white}
#status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

#status.connecting::before {
    content: "";
    width: 9px;
    height: 9px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

#status.connected::before {
    content: "";
    width: 9px;
    height: 9px;
    background: #22c55e;
    border-radius: 50%;
}

#status.disconnected::before {
    content: "";
    width: 9px;
    height: 9px;
    background: #ef4444;
    border-radius: 50%;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div>VOICE STAX</div>
    <div id="status">Disconnected</div>
  </div>
  <div class="chat">
    <div class="messages" id="chat"></div>
    <div class="controls">
      <button id="start" class="start">Start</button>
      <button id="stop" class="stop">Stop</button>
      <button id="clear">Clear</button>
      <button id="download">Download Transcript</button>
    </div>
  </div>
</div>

<script>
const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/chat`;

let ws;
let audioContext = null;
let playbackAudioContext = null;  // PCM TTS playback
let mediaStream = null;
let processor = null;
let source = null;
let transcript = [];
let mp3Chunks = [];
let bargeInFrames = 0;

let nextPcmStartTime = 0;
let pcmSources = [];
const PCM_PREBUFFER_SECONDS = 0.15;
const MAX_PENDING_AUDIO_FRAMES = 100;

let interruptSent = false;
let currentAudio = null;
let assistantSpeaking = false;
let listeningReady = false;
let pendingAudioFrames = [];
let bufferingAudio = false;
let playbackGeneration = 0;

const chat = document.getElementById("chat");
const statusEl = document.getElementById("status");

const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const clearBtn = document.getElementById("clear");
const downloadBtn = document.getElementById("download");

function setButtonsEnabled(enabled) {
    startBtn.disabled = !enabled;
    stopBtn.disabled = !enabled;
    clearBtn.disabled = !enabled;
    downloadBtn.disabled = !enabled;
}

setButtonsEnabled(false);

function addMsg(type, text){

    const row = document.createElement("div");

    row.className =
        type === "user"
            ? "message-row user-row"
            : "message-row ai-row";

    const avatar = document.createElement("div");

    avatar.className =
        type === "user"
            ? "avatar user-avatar"
            : "avatar ai-avatar";

    avatar.textContent =
        type === "user"
            ? "👤"
            : "🤖";

    const bubble = document.createElement("div");

    bubble.className = `msg ${type}`;

    // ── Current local time ───────────────────────────────
    const now = new Date();

    const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    // Message text
    const textElement = document.createElement("div");
    textElement.textContent = text;

    // Message timestamp
    const timeElement = document.createElement("div");
    timeElement.className = "message-time";
    timeElement.textContent = time;

    bubble.appendChild(textElement);
    bubble.appendChild(timeElement);

    if(type === "user"){
        row.appendChild(bubble);
        row.appendChild(avatar);
    }
    else{
        row.appendChild(avatar);
        row.appendChild(bubble);
    }

    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;

    transcript.push({
        role: type,
        text,
        time
    });
}

async function startMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      sampleRate: 16000,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  audioContext = new AudioContext({
    sampleRate: 16000
  });

  source = audioContext.createMediaStreamSource(mediaStream);

  processor = audioContext.createScriptProcessor(4096, 1, 1);

  processor.onaudioprocess = (event) => {
    console.log("onaudioprocess fired");

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    const inputData = event.inputBuffer.getChannelData(0);

    console.log("Mic samples:", inputData.length);

    const outputData = event.outputBuffer.getChannelData(0);
    outputData.fill(0);

    let energy = 0;

    for (let i = 0; i < inputData.length; i++) {
        energy += inputData[i] * inputData[i];
    }

    const rms = Math.sqrt(energy / inputData.length);

    if (assistantSpeaking && !interruptSent && rms > 0.06) {
        bargeInFrames++;
    } else {
        bargeInFrames = 0;
    }

    if (
        assistantSpeaking &&
        !interruptSent &&
        bargeInFrames >= 2 &&
        ws.readyState === WebSocket.OPEN
    ) {
        interruptSent = true;
        bargeInFrames = 0;

        console.log("BARGE-IN DETECTED", { rms });

        ws.send(JSON.stringify({ type: "interrupt" }));
        stopAudio();
    }

    // Don't send microphone audio until the greeting is finished
    // and the server confirms that STT is ready.
    // if (!listeningReady) {
    //     return;
    // }

    const pcm = new Int16Array(inputData.length);

    for (let i = 0; i < inputData.length; i++) {
        const s = Math.max(-1, Math.min(1, inputData[i]));
        pcm[i] = s < 0 ? s * 32768 : s * 32767;
    }

    if (ws && ws.readyState === WebSocket.OPEN) {
        if (listeningReady) {
            ws.send(pcm.buffer);
        }else if (bufferingAudio) {
            if (pendingAudioFrames.length < MAX_PENDING_AUDIO_FRAMES) {
                pendingAudioFrames.push(pcm.slice());
            } else {
                console.warn("Pending audio buffer limit reached");
            }
        }
    }
    console.log("Sent", pcm.byteLength, "bytes");
};

  source.connect(processor);
  processor.connect(audioContext.destination);
 // processor.disconnect();
}

function stopMic() {

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (source) {
    source.disconnect();
    source = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
}

function stopAudio() {

    playbackGeneration++;
    assistantSpeaking = false;
    interruptSent = true;
    bargeInFrames = 0;

    // ── Stop MP3 ─────────────────────────────────────────
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }

    mp3Chunks = [];

    // ── Stop PCM ─────────────────────────────────────────
    pcmSources.forEach(sourceNode => {
        try {
            sourceNode.stop();
        } catch (e) {
            // Already stopped/finished
        }
    });

    pcmSources = [];
    nextPcmStartTime = 0;
}

async function playPCMChunk(bytes) {

    const generation = playbackGeneration;
    const sampleRate = 24000; // ElevenLabs pcm_24000

    // Create separate playback context
    if (!playbackAudioContext) {
        playbackAudioContext = new AudioContext({
            sampleRate: sampleRate
        });
    }

    // Resume if browser suspended it
    if (playbackAudioContext.state === "suspended") {
        await playbackAudioContext.resume();
    }

    // An interruption may have happened during resume().
    if (generation !== playbackGeneration) {
        return;
    }

    // PCM s16le = signed 16-bit little-endian samples
    const int16Array = new Int16Array(
        bytes.buffer,
        bytes.byteOffset,
        Math.floor(bytes.byteLength / 2)
    );

    // Convert Int16 PCM → Float32 Web Audio samples
    const float32Array = new Float32Array(int16Array.length);

    for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768;
    }

    // Create mono audio buffer
    const audioBuffer = playbackAudioContext.createBuffer(
        1,
        float32Array.length,
        sampleRate
    );

    audioBuffer.copyToChannel(float32Array, 0);

    const sourceNode =
        playbackAudioContext.createBufferSource();

    sourceNode.buffer = audioBuffer;
    sourceNode.connect(playbackAudioContext.destination);

    // Schedule chunks continuously to avoid gaps. When the queue is empty
    // (stream start or underrun), start slightly in the future so network
    // jitter on the next chunks doesn't cause audible breaks.
    const now = playbackAudioContext.currentTime;
    const chunkDuration = bytes.byteLength / (sampleRate * 2);

    const schedulingGap = nextPcmStartTime > 0
        ? now - nextPcmStartTime
        : 0;

    console.log("[PCM PLAYBACK]", {
        arrivalTime: performance.now().toFixed(1),
        chunkBytes: bytes.byteLength,
        chunkDurationMs: (chunkDuration * 1000).toFixed(1),
        currentTime: now.toFixed(3),
        nextPcmStartTime: nextPcmStartTime.toFixed(3),
        schedulingGapMs: (schedulingGap * 1000).toFixed(1)
    });
    const startTime = nextPcmStartTime > now
        ? nextPcmStartTime
        : now + PCM_PREBUFFER_SECONDS;

    sourceNode.start(startTime);

    nextPcmStartTime =
        startTime + audioBuffer.duration;

    pcmSources.push(sourceNode);

    assistantSpeaking = true;
    interruptSent = false;
    bargeInFrames = 0;

    sourceNode.onended = () => {
        pcmSources = pcmSources.filter(
            source => source !== sourceNode
        );
    };
}

function setConnectionStatus(state, text) {
    statusEl.textContent = text;

    statusEl.classList.remove(
        "connecting",
        "connected",
        "disconnected"
    );

    statusEl.classList.add(state);
}

function connect(){

    // Initial state
    setConnectionStatus("disconnected", "Disconnected");

    // Give the user a moment to see the initial state
    setTimeout(() => {

        setConnectionStatus("connecting", "Connecting...");

        ws = new WebSocket(WS_URL);

        ws.onopen = () => {

            setConnectionStatus(
                "connecting",
                "Connected — initializing..."
            );
        };

        ws.onmessage = (event) => {

            const msg = JSON.parse(event.data);

            console.log(msg.type, msg.encoding);

            if(msg.type === "system_ready"){

                setConnectionStatus(
                    "connected",
                    "Connected"
                );

                setButtonsEnabled(true);

                return;
            }

            if(msg.type === "transcript"){
                addMsg(
                    msg.speaker === "assistant" ? "ai" : "user",
                    msg.text
                );
                return;
            }

            if (msg.type === "audio_chunk") {

                const binary = atob(msg.audio);

                const bytes = new Uint8Array(binary.length);

                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }


                if (msg.encoding === "pcm_s16le") {
                    playPCMChunk(bytes);
                    return;
                }

                
                if (msg.encoding === "mp3") {

                    mp3Chunks.push(bytes);

                    return;
                }

                console.warn(
                    "Unknown audio encoding:",
                    msg.encoding
                );

                return;
            }

            if (msg.type === "complete") {

                if (msg.encoding === "pcm_s16le") {

                    console.log("PCM stream complete");

                    const generation = playbackGeneration;

                    const checkPlaybackFinished = () => {

                        if (generation !== playbackGeneration) {
                            return;
                        }

                        if (
                            playbackAudioContext &&
                            playbackAudioContext.currentTime >= nextPcmStartTime
                        ) {

                            assistantSpeaking = false;
                            nextPcmStartTime = 0;

                            console.log(
                                "PCM playback completed"
                            );

                        } else {

                            setTimeout(
                                checkPlaybackFinished,
                                50
                            );
                        }
                    };

                    checkPlaybackFinished();

                    return;
                }

                const blob = new Blob(
                    mp3Chunks,
                    { type: "audio/mpeg" }
                );

                const url = URL.createObjectURL(blob);

                currentAudio = new Audio(url);

                assistantSpeaking = true;
                interruptSent = false;

                currentAudio.onended = () => {

                    assistantSpeaking = false;

                    URL.revokeObjectURL(url);
                };

                currentAudio.play()
                    .then(() => {
                        console.log("MP3 audio started");
                    })
                    .catch(err => {

                        console.error(
                            "Audio play failed:",
                            err
                        );
                    });

                mp3Chunks = [];

                return;
            }

            if(msg.type === "word"){
                return;
            }

            if(msg.type === "clear_audio") {

                console.log("CLEAR_AUDIO RECEIVED");

                stopAudio();

                return;
            }

            if (msg.type === "error") {

                addMsg(
                    "ai",
                    `Error: ${msg.message}`
                );

                return;
            }

            if (msg.type === "tts_error") {

                console.error(
                    "TTS Error:",
                    msg.message
                );

                assistantSpeaking = false;
                mp3Chunks = [];

                statusEl.textContent =
                    "Audio unavailable. You can continue speaking.";

                return;
            }

            if (msg.type === "session_ended") {

                statusEl.textContent =
                    "Session ended";

                stopMic();

                assistantSpeaking = false;

                return;
            }

            if (msg.type === "greeting_started") {

                statusEl.textContent =
                    "Assistant speaking...";

                return;
            }

            if (msg.type === "greeting_done") {
                bufferingAudio = true;
                statusEl.textContent =
                    "Greeting completed";

                return;
            }

            if (msg.type === "listening_ready") {
                for (const frame of pendingAudioFrames) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(frame.buffer);
                    }
                }
                pendingAudioFrames = [];
                bufferingAudio = false;
                listeningReady = true;
                statusEl.textContent =
                    "Listening...";

                return;
            }

            if (msg.type === "status") {

                statusEl.textContent =
                    msg.text;

                return;
            }

            if (msg.type === "human_handoff") {

                addMsg(
                    "ai",
                    "Connecting you to a human agent..."
                );

                statusEl.textContent =
                    "Human handoff";

                stopMic();

                return;
            }
        };

        ws.onerror = () => {

            setConnectionStatus(
                "disconnected",
                "Connection failed"
            );

            setButtonsEnabled(false);
        };

        ws.onclose = () => {

            setConnectionStatus(
                "disconnected",
                "Disconnected"
            );

            setButtonsEnabled(false);

            stopMic();
        };

    }, 500);
}

document.getElementById("start").onclick = async () => {

    const unlock = new Audio();
    unlock.play().catch(() => {});

    if(!ws || ws.readyState !== WebSocket.OPEN){
        console.error("WebSocket not connected");
        return;
    }

    listeningReady = false;
    bufferingAudio = false;
    pendingAudioFrames = [];
    await startMic();
    ws.send(JSON.stringify({ type: "start" }));
};

document.getElementById("stop").onclick = () => {
  listeningReady = false;
  bufferingAudio = false;
  pendingAudioFrames = [];
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({ type: "stop" }));
  }
  stopMic();
  stopAudio();
};

document.getElementById("clear").onclick = () => {
  chat.innerHTML = "";
  transcript = [];
  stopAudio();
};

document.getElementById("download").onclick = () => {
  const text = transcript
    .map(m => `${m.role.toUpperCase()}: ${m.text}`)
    .join("\n");

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "transcript.txt";
  a.click();

  URL.revokeObjectURL(url);
};

connect();

</script>
</body>
</html>
